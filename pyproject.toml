[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nusecast-lab"
version = "0.1.0"
description = "Laboratorio reproducible de pronóstico mensual de incidentes NUSE 123"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.15,<2",
  "scikit-learn>=1.7,<1.9", "holidays>=0.60,<1",
  "plotly>=6,<7", "streamlit>=1.50,<2", "requests>=2.32,<3",
  "openpyxl>=3.1,<4", "defusedxml>=0.7,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nusecast = "nusecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
